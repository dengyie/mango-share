name: Deploy to Production

# Push to main = build + deploy to nl-vps via google-vps relay (GitHub runners
# have no IPv6, and the LeaseWeb IPv4 :22 endpoint is not this host's sshd).
on:
  push:
    branches: [main]
  workflow_dispatch:

# workflow_dispatch can target any branch; only main may ever reach production.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/relay_key ~/.ssh/deploy_key ~/.ssh/known_hosts
          # Host keys are pinned (StrictHostKeyChecking yes), not TOFU: every
          # runner is ephemeral, so accept-new would re-trust whatever endpoint
          # answers on each run. The pinned keys were verified against the
          # hosts' own sshd public keys (fingerprint kLmFsR/... for nl-vps).
          cat >> ~/.ssh/config << 'CFG'
          Host relay
            HostName 35.212.179.13
            User ci-relay
            IdentityFile ~/.ssh/relay_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host nl-target
            HostName 10.144.144.12
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyJump relay
            StrictHostKeyChecking yes
          CFG
          chmod 600 ~/.ssh/config
        env:
          RELAY_KEY: ${{ secrets.CI_RELAY_SSH_KEY }}
          DEPLOY_KEY: ${{ secrets.NL_VPS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CI_SSH_KNOWN_HOSTS }}

      - name: Deploy (rsync over relay + nginx reload)
        run: |
          # Fail before touching the webroot if the existing nginx configuration
          # is invalid or the deploy user cannot run the permitted check.
          ssh -F $HOME/.ssh/config nl-target 'sudo -n /usr/sbin/nginx -t'
          backup=$(mktemp -d)
          # Complete the snapshot before any mutation. Requires the deploy user
          # to be able to read every file in the existing webroot.
          rsync -az -e "ssh -F $HOME/.ssh/config" nl-target:/var/www/mangoshare/ "$backup/"
          rollback() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "Deploy failed; attempting webroot rollback" >&2
              if rsync -az --delete -e "ssh -F $HOME/.ssh/config" "$backup/" nl-target:/var/www/mangoshare/ &&
                 ssh -F "$HOME/.ssh/config" nl-target 'sudo -n /usr/sbin/nginx -t && sudo -n /usr/bin/systemctl reload nginx'; then
                echo "Webroot restored; public availability still requires verification." >&2
              else
                echo "Rollback failed; manual recovery required. Runner snapshot: $backup (ephemeral)." >&2
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT
          rsync -az --delete -e "ssh -F $HOME/.ssh/config" dist/ nl-target:/var/www/mangoshare/
          ssh -F $HOME/.ssh/config nl-target 'sudo -n /usr/sbin/nginx -t && sudo -n /usr/bin/systemctl reload nginx'
          trap - EXIT
          rm -rf "$backup"
          echo "Origin update completed for $(git rev-parse --short HEAD) at $(date -u +%FT%TZ)"

      - name: Verify production
        run: |
          # This is an external availability check, not proof of the revision
          # served by the origin (a CDN may cache the response).
          for i in $(seq 1 5); do
            code=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' https://share.mangoqwq.com) || code=000
            echo "attempt $i: HTTP status $code"
            [ "$code" = "200" ] && exit 0
            [ "$i" -eq 5 ] || sleep 5
          done
          echo "Production check failed; webroot may be partially or fully updated. Manual recovery required."
          exit 1
