name: Deploy Account Server

# server/** changes = rebuild the Go account backend and restart it on
# tencent-lh (212.64.10.215, direct SSH — no relay needed since the 2026-11-12
# migration from nl-vps).
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

# workflow_dispatch can target any branch; only main may ever reach production.
permissions:
  contents: read

concurrency:
  group: deploy-account-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt required on:"; gofmt -l .; exit 1; }
          go test ./...
        working-directory: server

      - name: Build (linux/amd64, no cgo — modernc.org/sqlite)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /tmp/mangoshare-account .
        working-directory: server

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # Same pinned-key SSH config as deploy.yml (see the notes there).
          cat >> ~/.ssh/config << 'CFG'
          Host lh-target
            HostName 212.64.10.215
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG
          chmod 600 ~/.ssh/config
        env:
          DEPLOY_KEY: ${{ secrets.LH_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}

      - name: Deploy (rsync binary + restart service)
        run: |
          # /var/www/mangoshare-bin is deploy-writable and NOT the rsync
          # --delete webroot, so the binary survives frontend deploys.
          # Stage separately: a failed transfer must not overwrite the live binary.
          stage="/var/www/mangoshare-bin/.mangoshare-account-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rsync -az -e "ssh -F $HOME/.ssh/config" /tmp/mangoshare-account "lh-target:$stage"
          ssh -F "$HOME/.ssh/config" lh-target sh -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -eu
          dir=/var/www/mangoshare-bin
          live="$dir/mangoshare-account"
          stage="$dir/.mangoshare-account-$1-$2"
          backup="$dir/.mangoshare-account-backup-$1-$2"
          test -f "$live" && test -r "$live" && test -f "$stage"
          cp -p "$live" "$backup"
          rollback() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "Deployment failed; attempting binary rollback (backup: $backup)" >&2
              if cp -p "$backup" "$stage" && mv -f "$stage" "$live" && sudo -n /usr/bin/systemctl restart mangoshare-account.service; then
                echo "Previous binary restored and restart requested; verify service and data manually." >&2
              else
                echo "Rollback failed; manual recovery required, backup retained at $backup" >&2
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT
          mv -f "$stage" "$live"
          sudo -n /usr/bin/systemctl restart mangoshare-account.service
          # Probe the documented local listener, not the CDN: public network
          # failures alone must not trigger a potentially destructive rollback.
          healthy=0
          for i in $(seq 1 15); do
            body=$(curl -fsS --connect-timeout 5 --max-time 8 http://127.0.0.1:8090/api/health) || body=''
            if [ "$body" = '{"status":"ok"}' ]; then healthy=1; break; fi
            echo "local health attempt $i failed" >&2
            [ "$i" -eq 15 ] || sleep 15
          done
          [ "$healthy" -eq 1 ]
          sudo -n /usr/bin/systemctl is-active mangoshare-account.service
          trap - EXIT
          rm -f "$backup"
          REMOTE
          echo "Origin deployment passed; checking public route next."

      - name: Verify production
        run: |
          for i in $(seq 1 5); do
            body=$(curl -fsS --connect-timeout 5 --max-time 8 https://share.mangoqwq.com/account-api/api/health || true)
            [ "$body" = '{"status":"ok"}' ] && break
            echo "attempt $i: not healthy yet (${body:-no response}); retrying in 15s"
            sleep 15
          done
          [ "$body" = '{"status":"ok"}' ] || { echo "Production health check failed after retries"; exit 1; }
          echo "health: $body"
