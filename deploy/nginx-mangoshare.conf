# mangoshare frontend + account backend proxy
#
# Canonical copy: the live file on tencent-lh is
# /etc/nginx/sites-available/mangoshare (symlinked from sites-enabled).
# Keep this file in sync with that one; deploy does not push it (nginx
# config changes are applied manually with `nginx -t && systemctl reload
# nginx`), so this is the reviewed source of truth for config drift.
#
# loopback-only listener; cloudflared tunnel (tencent-mangoshare) forwards
# share.mangoqwq.com and card.mangoqwq.com here. Both are the same SPA —
# card is the legacy alias entry of share — hence both names listed.
server {
    listen 127.0.0.1:18923;
    server_name share.mangoqwq.com card.mangoqwq.com;

    root /var/www/mangoshare;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CF-Connecting-IP is set by the Cloudflare edge and survives the tunnel
    # hop as the true client address; $remote_addr here is cloudflared's own
    # loopback connection, useless for per-IP rate limiting. The backend's
    # clientIP() only accepts X-Real-IP from a loopback peer, so this header
    # cannot be spoofed past 127.0.0.1.
    location /account-api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
