# mangoshare frontend + account backend proxy
#
# Canonical copy: the live file on tencent-lh is
# /etc/nginx/sites-available/mangoshare (symlinked from sites-enabled).
# Keep this file in sync with that one; deploy does not push it (nginx
# config changes are applied manually with `nginx -t && systemctl reload
# nginx`), so this is the reviewed source of truth for config drift.
#
# loopback-only listener; cloudflared tunnel (tencent-mangoshare) forwards
# share.mangoqwq.com and card.mangoqwq.com here. Both are the same SPA —
# card is the legacy alias entry of share — hence both names listed.
# /blog/ serves the Astro blog (also published by CI) under the same site.
server {
    listen 127.0.0.1:18923;
    server_name share.mangoqwq.com card.mangoqwq.com;

    root /var/www/mangoshare;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. TLS terminates at Cloudflare; these pass through to
    # browsers. CSP: SPA + blog load scripts/styles from self, cdnjs
    # (FontAwesome) and Google Fonts; the hundreds of card/station links are
    # plain <a href> (navigations are not CSP-restricted); img-src allows
    # remote avatars and data: URIs.
    # NOTE: add_header in a location block would DROP these server-level
    # headers unless that location repeats them all — /assets/ below only
    # overrides caching because CF/origin caching is age-based, and the
    # security headers are inherited there only because it re-declares them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;

    # CF-Connecting-IP is set by the Cloudflare edge and survives the tunnel
    # hop as the true client address; $remote_addr here is cloudflared's own
    # loopback connection, useless for per-IP rate limiting. The backend's
    # clientIP() only accepts X-Real-IP from a loopback peer, so this header
    # cannot be spoofed past 127.0.0.1.
    location /account-api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header here resets inheritance: repeat the security headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;
    }

    location /blog/ {
        # Astro 静态博客（mangoshare 仓库 blog/ 子目录，CI 双 rsync 发布）。
        # 未知路径回落到博客自己的 404 页，而不是 SPA 的 index.html。
        try_files $uri $uri/ /blog/404.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
